  -
    slug: alice
    title: Alice
    short_description: 'Nowoczesna strona one-page dla gabinetu fizjoterapii uroginekologicznej i maderoterapii. Strona prezentuje ofertę gabinetu, najważniejsze informacje oraz ułatwia potencjalnym klientkom kontakt i umówienie wizyty.'
    description: |-
      Projekt obejmował stworzenie od podstaw responsywnej strony internetowej dla gabinetu Fizjoterapii Uroginekologicznej i Maderoterapii. Celem było przygotowanie prostej i przejrzystej wizytówki internetowej, która w czytelny sposób przedstawia zakres oferowanych usług i najważniejsze informacje o gabinecie.

      Strona została zbudowana w React.js i zaprojektowana z podejściem mobile-first, ze szczególnym uwzględnieniem wygodnego korzystania z niej na urządzeniach mobilnych. Warstwa wizualna powstała na podstawie własnej koncepcji, częściowo inspirowanej materiałami promocyjnymi gabinetu przygotowanymi wcześniej przez zewnętrzne biuro marketingowe.

      Projekt został zrealizowany kompleksowo — od przygotowania strony i interfejsu, przez implementację poszczególnych sekcji, po wdrożenie.
