projects:
  -
    slug: mug-3d-art
    title: 'mug 3d art'
    short_description: 'Mug 3D Art to interaktywny konfigurator kubków 3D, który pozwala użytkownikowi stworzyć własny projekt nadruku i od razu zobaczyć, jak będzie wyglądał na rzeczywistym modelu kubka. Aplikacja umożliwia dodawanie grafik i tekstów, zmianę kolorów poszczególnych elementów oraz zapisanie i udostępnienie gotowego projektu.'
    description: |-
      Mug 3D Art został stworzony dla firmy zajmującej się produkcją nadruków na kubkach. Kluczowym elementem aplikacji jest interaktywny model 3D, który można swobodnie obracać i przybliżać, aby zobaczyć projekt z każdej strony.

      Użytkownik może dodać własne zdjęcie lub logo, umieścić na kubku tekst oraz dostosować wygląd poszczególnych elementów. Możliwe jest niezależne zmienianie kolorów korpusu i ucha kubka, dzięki czemu projekt można skonfigurować zgodnie z własnymi potrzebami.

      Gotowy projekt można zapisać i udostępnić za pomocą linku. Odbiorca udostępnionego projektu otrzymuje dostęp do interaktywnego podglądu — może obracać i oglądać kubek, ale nie może modyfikować jego ustawień.

      W projekcie wykorzystano React, MobX i Babylon.js. Backend oparty był na istniejącym rozwiązaniu PHP Symfony.
