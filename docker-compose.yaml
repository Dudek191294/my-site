services:
  php:
    build: .
    image: moja-strona-php:dev
    volumes:
      - .:/var/www
      - ./config:/etc/frankenphp
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "8085:80"
    depends_on:
      - db
    environment:
      POSTGRES_PASSWORD: v7WUnpu8kDAzjtFBfq4n
      DATABASE_URL: postgresql://postgres:v7WUnpu8kDAzjtFBfq4n@db:5432/app?serverVersion=18&charset=utf8

  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: v7WUnpu8kDAzjtFBfq4n
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
